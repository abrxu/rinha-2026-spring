services:
  lb:
    image: nginx:alpine
    platform: linux/amd64
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "20M"
    networks:
      - rinha

  api1:
    image: ghcr.io/abrxu/rinha-2026-spring:latest
    platform: linux/amd64
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "165M"
    networks:
      - rinha

  api2:
    image: ghcr.io/abrxu/rinha-2026-spring:latest
    platform: linux/amd64
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "165M"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
